<!DOCTYPE html>
<html lang="nl">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ongelooflijk Archief</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,500;0,600;0,700;1,500&family=Spectral:ital,wght@0,400;0,600;1,400&display=swap">
<style>
/* Layout: a reference archive — narrow masthead with the saint medallion and search, then one content column of cards and charts; tokens follow the De Ongelooflijke design system */
:root{
  --parchment:#f0e2cd; --parchment-2:#e2d4c1; --parchment-3:#d0c3b1; --rule:#d8cbb9;
  --ink:#363737; --ink-muted:#5e5549; --gold:#c2a678; --gold-deep:#7a5c2e;
  --engraving:#3e2b16; --violet:#8720f7; --violet-deep:#7a1fe0; --halo:#ffffff;
  --mark:rgba(135,32,247,.16); --teal:#1f6f63; --rose:#a3324f;
  --display:"Lora",Georgia,"Times New Roman",serif;
  --body:"Spectral",Georgia,"Times New Roman",serif;
  --ui:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --parchment:#1c1712; --parchment-2:#262019; --parchment-3:#332b22; --rule:#3d342a;
  --ink:#f0e2cd; --ink-muted:#b9a68c; --gold:#c2a678; --gold-deep:#d1b382;
  --engraving:#2b1f10; --violet:#b88cff; --violet-deep:#8720f7; --mark:rgba(184,140,255,.22); --teal:#5cc0ad; --rose:#f08aa3; color-scheme:dark}}
:root[data-theme="dark"]{
  --parchment:#1c1712; --parchment-2:#262019; --parchment-3:#332b22; --rule:#3d342a;
  --ink:#f0e2cd; --ink-muted:#b9a68c; --gold:#c2a678; --gold-deep:#d1b382;
  --engraving:#2b1f10; --violet:#b88cff; --violet-deep:#8720f7; --mark:rgba(184,140,255,.22); --teal:#5cc0ad; --rose:#f08aa3; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--parchment);color:var(--ink);font:18px/1.6 var(--body);}
a{color:var(--violet);text-decoration-thickness:1px;text-underline-offset:2px}
a:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--violet);outline-offset:2px}
h1,h2,h3{font-family:var(--display);text-wrap:balance;margin:0;line-height:1.15}
h1{font-size:clamp(28px,4.4vw,44px);font-weight:700}
h2{font-size:24px;font-weight:600}
h3{font-size:19px;font-weight:600}
.wrap{max-width:1120px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.ui{font-family:var(--ui)}
.num{font-family:var(--ui);font-variant-numeric:tabular-nums}
.muted{color:var(--ink-muted)}
.label{font:600 12px/1.3 var(--ui);letter-spacing:.08em;text-transform:uppercase;color:var(--ink-muted)}

/* masthead */
header.mast{border-bottom:1px solid var(--rule)}
.mast .wrap{display:flex;align-items:center;gap:16px;padding-block:14px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:12px;color:var(--ink);text-decoration:none;flex-shrink:0}
.brand img{width:52px;height:52px;border-radius:999px;display:block}
.brand b{font:700 21px/1.05 var(--display);display:block}
.brand span{font:600 11px/1.3 var(--ui);letter-spacing:.12em;text-transform:uppercase;color:var(--gold-deep)}
nav.main{display:flex;gap:2px;flex-wrap:wrap;font:500 14.5px/1 var(--ui)}
nav.main a{color:var(--ink);text-decoration:none;padding:9px 10px;border-radius:999px}
nav.main a:hover{background:var(--parchment-2)}
nav.main a.on{background:var(--ink);color:var(--parchment)}
.qbox{margin-left:auto;flex:1 1 150px;max-width:300px;position:relative}
.qbox input{width:100%;font:16px var(--ui);padding:10px 14px 10px 38px;border:1px solid var(--rule);background:var(--parchment-2);color:var(--ink);border-radius:999px}
.qbox svg{position:absolute;left:13px;top:50%;transform:translateY(-50%);width:16px;height:16px;stroke:var(--ink-muted);fill:none;stroke-width:2}
@media (max-width:760px){.qbox{max-width:none;margin-left:0;flex-basis:100%;order:3}}

main{padding-block:28px 64px}
section+section{margin-top:44px}
.sechead{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:14px;flex-wrap:wrap;border-bottom:1px solid var(--rule);padding-bottom:8px}

/* hero */
.hero{display:grid;grid-template-columns:minmax(0,1fr) 220px;gap:32px;align-items:center}
.hero p.lede{font-size:20px;max-width:58ch;margin:12px 0 0}
.hero img{width:220px;height:220px;border-radius:999px;display:block}
@media (max-width:700px){.hero{grid-template-columns:1fr}.hero img{width:140px;height:140px;order:-1}}
.facts{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));border-top:1px solid var(--rule);border-bottom:1px solid var(--rule);margin-top:26px}
.facts div{padding:14px 12px 12px;border-left:1px solid var(--rule)}
.facts div:first-child{border-left:0;padding-left:0}
.facts b{display:block;font:600 30px/1.05 var(--display);font-variant-numeric:lining-nums tabular-nums}
.facts span{font:13px/1.3 var(--ui);color:var(--ink-muted)}
@media (max-width:620px){.facts{grid-template-columns:repeat(2,minmax(0,1fr))}.facts div:nth-child(3){border-left:0;padding-left:0}.facts div{border-top:1px solid var(--rule)}.facts div:nth-child(-n+2){border-top:0}}

/* episode rows */
.eps{display:grid;gap:0}
.ep{display:grid;grid-template-columns:64px minmax(0,1fr) auto;gap:4px 16px;padding:16px 0;border-bottom:1px solid var(--rule);align-items:baseline}
.ep .no{font:600 17px/1.2 var(--ui);font-variant-numeric:tabular-nums;color:var(--gold-deep)}
.ep h3 a{color:var(--ink);text-decoration:none}
.ep h3 a:hover{color:var(--violet);text-decoration:underline}
.ep .meta{font:14px/1.4 var(--ui);color:var(--ink-muted);margin-top:4px}
.ep .meta a{color:var(--ink-muted)}
.ep .snip{font-size:16px;line-height:1.5;margin:8px 0 0;max-width:72ch}
.ep .dur{font:14px var(--ui);font-variant-numeric:tabular-nums;color:var(--ink-muted);white-space:nowrap}
@media (max-width:560px){.ep{grid-template-columns:48px minmax(0,1fr)}.ep .dur{display:none}}
mark{background:var(--mark);color:inherit;padding:0 1px;border-radius:2px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.chip{font:500 12.5px/1 var(--ui);padding:6px 10px;border-radius:999px;border:1px solid var(--rule);color:var(--ink);background:transparent;text-decoration:none;cursor:pointer}
.chip:hover{border-color:var(--ink-muted)}
.chip.on{background:var(--violet-deep);border-color:var(--violet-deep);color:#fff}
.badge{font:600 11px/1 var(--ui);letter-spacing:.06em;text-transform:uppercase;padding:4px 7px;border-radius:4px;background:var(--gold);color:#3e2b16;vertical-align:2px;margin-left:6px}

/* search layout */
.searchgrid{display:grid;grid-template-columns:250px minmax(0,1fr);gap:32px}
@media (max-width:860px){.searchgrid{grid-template-columns:1fr}}
.filters{display:grid;gap:18px;align-content:start;font-family:var(--ui);font-size:14px}
.filters fieldset{border:0;padding:0;margin:0;display:grid;gap:8px}
.filters legend{padding:0;margin-bottom:6px}
.filters select,.filters input[type=number],.filters input[type=search]{font:15px var(--ui);padding:8px 10px;border:1px solid var(--rule);border-radius:10px;background:var(--parchment-2);color:var(--ink);width:100%}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.check{display:flex;gap:8px;align-items:center}
.btn{font:600 14px/1 var(--ui);padding:10px 14px;border-radius:999px;border:1px solid var(--ink);background:transparent;color:var(--ink);cursor:pointer;text-decoration:none;display:inline-flex;gap:8px;align-items:center}
.btn:hover{background:var(--ink);color:var(--parchment)}
.btn.solid{background:var(--violet-deep);border-color:var(--violet-deep);color:#fff}
.btn.solid:hover{filter:brightness(1.1)}
.resbar{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;font:14px var(--ui);color:var(--ink-muted);padding-bottom:8px;border-bottom:1px solid var(--ink)}
.resbar select{font:14px var(--ui);padding:6px 8px;border-radius:8px;border:1px solid var(--rule);background:var(--parchment-2);color:var(--ink)}
.bigq{width:100%;font:22px var(--display);padding:12px 16px;border:1px solid var(--rule);border-radius:10px;background:var(--parchment-2);color:var(--ink);margin-bottom:16px}

/* detail pages */
.crumb{font:14px var(--ui);margin-bottom:14px}
.crumb a{color:var(--ink-muted)}
.detail{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:40px}
@media (max-width:900px){.detail{grid-template-columns:1fr}}
.epno{font:600 15px var(--ui);letter-spacing:.08em;color:var(--gold-deep);text-transform:uppercase}
.prose{max-width:66ch}
.prose p{margin:0 0 1em}
.side{display:grid;gap:22px;align-content:start}
.panel{background:var(--parchment-2);border-radius:10px;padding:18px 20px}
.panel h3{font-size:16px;margin-bottom:10px}
dl.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;margin:0;font:14px/1.4 var(--ui)}
dl.kv dt{color:var(--ink-muted)} dl.kv dd{margin:0;font-variant-numeric:tabular-nums}
.cast{display:grid;gap:10px}
.cast a.person{display:grid;grid-template-columns:44px 1fr;gap:12px;align-items:center;text-decoration:none;color:var(--ink)}
.ini{width:44px;height:44px;border-radius:999px;background:var(--gold);color:#3e2b16;display:grid;place-items:center;font:600 15px var(--ui)}
.ini.host{background:var(--engraving);color:#fff;box-shadow:inset 0 0 0 1px var(--gold)}
.person b{font:600 16px/1.2 var(--display);display:block}
.person span{font:13px/1.3 var(--ui);color:var(--ink-muted)}
.person:hover b{color:var(--violet)}
blockquote.q{font:italic 400 21px/1.4 var(--body);margin:0;padding:4px 0 4px 18px;border-left:2px solid var(--gold)}
.qwall{columns:2 320px;column-gap:32px}
.qwall figure{break-inside:avoid;margin:0 0 26px}
.qwall figcaption{font:13px/1.4 var(--ui);color:var(--ink-muted);margin-top:8px}
.trivia{margin:0;padding-left:18px;font-size:16px} .trivia li{margin-bottom:6px}
.actions{display:flex;gap:10px;flex-wrap:wrap;margin:18px 0 24px}
.prevnext{display:flex;justify-content:space-between;gap:16px;margin-top:28px;font:14px var(--ui);flex-wrap:wrap}

/* people index */
.people{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:0 28px}
.people a.person{padding:10px 0;border-bottom:1px solid var(--rule)}
.alpha{display:flex;flex-wrap:wrap;gap:4px;font:600 14px var(--ui);margin-bottom:12px}
.alpha a{padding:6px 8px;border-radius:6px;text-decoration:none;color:var(--ink)}
.alpha a:hover{background:var(--parchment-2)}

/* charts */
.charts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:28px}
@media (max-width:820px){.charts{grid-template-columns:1fr}}
.chart{min-width:0}
.chart.wide{grid-column:1/-1}
.chart h3{margin-bottom:4px}
.chart p.note{font:13px/1.4 var(--ui);color:var(--ink-muted);margin:0 0 10px}
.scroll{overflow-x:auto}
svg.c{display:block;width:100%;height:auto;font-family:var(--ui)}
svg.c text{fill:var(--ink-muted);font-size:12px}
@media (max-width:600px){svg.c text{font-size:15px}svg.c .lbl{font-size:15px}}
svg.c .grid{stroke:var(--rule);stroke-width:1}
svg.c .bar{fill:var(--gold)}
svg.c .bar2{fill:var(--violet)}
svg.c .line{fill:none;stroke:var(--violet);stroke-width:2}
svg.c .dot{fill:var(--gold-deep)}
svg.c a:hover .dot{fill:var(--violet)}
svg.c .lbl{fill:var(--ink);font-size:12px}
.hbars{display:grid;gap:6px;font:14px/1.2 var(--ui)}
.hbar{display:grid;grid-template-columns:minmax(90px,170px) minmax(0,1fr) 42px;gap:10px;align-items:center}
.hbar .t{height:14px;background:var(--parchment-3);border-radius:3px;overflow:hidden}
.hbar .t i{display:block;height:100%;background:var(--gold)}
.hbar .t i.v{background:var(--violet)}
.hbar a,.hbar span.n{color:var(--ink);text-decoration:none;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hbar a:hover{color:var(--violet)}
.hbar .v{text-align:right;font-variant-numeric:tabular-nums;color:var(--ink-muted)}
.heat{border-collapse:collapse;font:12px var(--ui);width:100%}
.heat th{font-weight:500;color:var(--ink-muted);text-align:left;padding:4px 8px 4px 0;white-space:nowrap}
.heat thead th{text-align:center;padding:4px 2px}
.heat td{padding:0;border:2px solid var(--parchment)}
.heat td div{height:24px;border-radius:3px;display:grid;place-items:center;font-variant-numeric:tabular-nums}
.ctrl{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px;font:14px var(--ui)}
.ctrl select,.ctrl input{font:14px var(--ui);padding:7px 9px;border-radius:8px;border:1px solid var(--rule);background:var(--parchment-2);color:var(--ink)}
.cloud{display:flex;flex-wrap:wrap;gap:4px 12px;align-items:baseline;line-height:1.2}
.cloud a{text-decoration:none;color:var(--ink);font-family:var(--display)}
.cloud a:hover{color:var(--violet)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font:13px var(--ui);color:var(--ink-muted);margin-top:6px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}
.callout{font:14px/1.5 var(--ui);background:var(--parchment-2);border-radius:10px;padding:14px 16px;color:var(--ink)}
.tl{position:relative;height:46px;margin:10px 0 4px}
.tl .axis{position:absolute;left:0;right:0;top:20px;border-top:1px solid var(--rule)}
.tl a{position:absolute;top:13px;width:14px;height:14px;margin-left:-7px;border-radius:999px;background:var(--gold);border:2px solid var(--parchment)}
.tl a:hover{background:var(--violet)}
.tl span{position:absolute;top:28px;font:11px var(--ui);color:var(--ink-muted);transform:translateX(-50%)}
footer.foot{background:var(--engraving);color:#f0e2cd;padding-block:28px}
footer.foot .wrap{display:flex;gap:24px;align-items:center;justify-content:space-between;flex-wrap:wrap;font:14px/1.5 var(--ui)}
footer.foot img{height:40px;width:auto}
footer.foot a{color:#f0e2cd}
.empty{padding:28px 0;font-size:18px;color:var(--ink-muted)}
.loading{color:var(--ink-muted);font:16px var(--ui);padding:40px 0;text-align:center}
.loading::before{content:'';display:inline-block;width:16px;height:16px;border:2px solid var(--rule);border-top-color:var(--violet);border-radius:50%;animation:spin .8s linear infinite;vertical-align:-3px;margin-right:8px}
@keyframes spin{to{transform:rotate(360deg)}}
@media(prefers-reduced-motion:reduce){.loading::before{animation:none;border-color:var(--violet)}}
@media (prefers-reduced-motion:no-preference){.ep,.person{transition:background .15s}}

/* ---- transcript layer ---- */
.demo{font:600 11px/1 var(--ui);letter-spacing:.06em;text-transform:uppercase;color:var(--gold-deep);border:1px dashed var(--gold-deep);border-radius:4px;padding:4px 6px;white-space:nowrap}
.demonote{font:14px/1.5 var(--ui);color:var(--ink-muted);border-left:2px dashed var(--gold);padding:2px 0 2px 12px;margin:0 0 22px;max-width:70ch}
.txwrap{margin-top:8px}
.tabs{display:flex;gap:2px;align-items:center;border-bottom:1px solid var(--ink);margin-bottom:22px;overflow-x:auto;scrollbar-width:none}
.tab{font:600 15px/1 var(--ui);white-space:nowrap;padding:12px 12px;border:0;background:none;color:var(--ink-muted);cursor:pointer;border-bottom:3px solid transparent;margin-bottom:-2px}
.tab:hover{color:var(--ink)}
.tab.on{color:var(--ink);border-bottom-color:var(--violet)}
.tabs .demo{margin-left:auto}
.tabp h2{font-size:21px;margin:28px 0 10px}
.tabp h2:first-child{margin-top:0}
.tldr{font:400 21px/1.5 var(--body);margin:0;max-width:62ch}
.points{margin:0;padding-left:20px;max-width:66ch;font-size:17px}
.points li{margin-bottom:8px}
.tbtn{font:600 13px/1 var(--ui);font-variant-numeric:tabular-nums;color:var(--violet);background:transparent;border:1px solid var(--rule);border-radius:999px;padding:6px 9px;cursor:pointer;white-space:nowrap}
.tbtn:hover{border-color:var(--violet)}
.river{position:relative;height:22px;background:var(--parchment-3);border-radius:4px;overflow:hidden;cursor:pointer}
.river i{position:absolute;top:0;bottom:0;border-right:1px solid var(--parchment)}
.river .lg{position:absolute;top:-1px;width:6px;height:6px;margin-left:-3px;border-radius:999px;background:var(--halo);box-shadow:0 0 0 1.5px var(--engraving)}
.river .ct{position:absolute;top:0;bottom:0;width:2px;margin-left:-1px;background:var(--parchment)}
.spk{display:flex;gap:14px;flex-wrap:wrap;margin-top:10px;font:14px var(--ui)}
.spk span{display:inline-flex;align-items:center;gap:6px}
.spk i{width:10px;height:10px;border-radius:999px;display:inline-block}
.hl{list-style:none;margin:0;padding:0;display:grid;gap:0}
.hl li{display:grid;grid-template-columns:76px minmax(0,1fr);gap:12px;padding:12px 0;border-bottom:1px solid var(--rule);align-items:start}
.hl p{margin:4px 0 0;font-size:17px;line-height:1.5}
.chapters{list-style:none;margin:0;padding:0;position:relative}
.chapters li{display:grid;grid-template-columns:92px minmax(0,1fr);gap:16px;padding:0 0 26px;position:relative}
.chapters li::before{content:"";position:absolute;left:44px;top:34px;bottom:4px;width:1px;background:var(--rule)}
.chapters li:last-child::before{display:none}
.chapters .when{display:grid;gap:4px;justify-items:center;font:12px var(--ui);color:var(--ink-muted);font-variant-numeric:tabular-nums}
.chapters h3{font-size:20px;margin:2px 0 6px}
.chapters p{margin:0 0 8px;font-size:16px;line-height:1.55;max-width:64ch}
.chapters .who{font:13px var(--ui);color:var(--ink-muted);display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.chapters li.cur h3{color:var(--violet)}
.trctrl{display:flex;gap:12px;flex-wrap:wrap;align-items:center;margin-bottom:12px;font:14px var(--ui)}
.trctrl input[type=search]{flex:1 1 220px;font:15px var(--ui);padding:9px 12px;border-radius:999px;border:1px solid var(--rule);background:var(--parchment-2);color:var(--ink)}
.segs{display:grid;gap:0;max-height:70vh;overflow-y:auto;border:1px solid var(--rule);border-radius:10px;padding:4px 16px}
.seg{display:grid;grid-template-columns:70px minmax(0,1fr);gap:12px;padding:12px 0;border-bottom:1px solid var(--rule)}
.seg:last-child{border-bottom:0}
.seg b{font:600 14px var(--ui)}
.seg p{margin:2px 0 0;font-size:17px;line-height:1.55}
.seg.on{background:var(--mark);margin:0 -16px;padding-left:16px;padding-right:16px}
.segs .chh{font:600 12px var(--ui);letter-spacing:.08em;text-transform:uppercase;color:var(--gold-deep);padding:16px 0 4px}
.segs .lgh{font:italic 14px var(--body);color:var(--ink-muted);padding:6px 0 6px 82px}
.tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));border-top:1px solid var(--rule)}
.tiles div{padding:14px 12px 14px 0;border-bottom:1px solid var(--rule)}
.tiles b{display:block;font:600 28px/1.05 var(--display);font-variant-numeric:lining-nums tabular-nums}
.tiles span{font:13px/1.3 var(--ui);color:var(--ink-muted)}
@media (max-width:560px){.tiles{grid-template-columns:repeat(2,minmax(0,1fr))}}
table.tics{border-collapse:collapse;font:14px var(--ui);width:100%}
table.tics th,table.tics td{padding:7px 8px;border-bottom:1px solid var(--rule);text-align:right;font-variant-numeric:tabular-nums}
table.tics th:first-child,table.tics td:first-child{text-align:left}
table.tics thead th{font-weight:600;color:var(--ink-muted);font-size:12.5px}
table.tics td.hot{color:var(--ink);font-weight:700}
.bingo{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;max-width:520px}
.bingo div{aspect-ratio:1.35;border:1px solid var(--rule);border-radius:10px;padding:10px;display:grid;align-content:space-between;font:600 14px/1.25 var(--ui);color:var(--ink-muted)}
.bingo div.hit{background:var(--gold);border-color:var(--gold);color:#3e2b16}
.bingo div.hit .tbtn{color:#3e2b16;border-color:rgba(62,43,22,.4);justify-self:start}
.bingo-yes{font:700 22px var(--display);color:var(--violet);margin:10px 0 0}
.mentions{display:grid;gap:8px}
.mentions div{display:flex;gap:10px;align-items:center;flex-wrap:wrap;font-size:16px}
.anchart{margin-top:6px}

<script>
(function(){
const D=JSON.parse(document.getElementById('data').textContent);

const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const norm=s=>s.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');
const slug=s=>norm(s).replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'');
const MONTHS=['januari','februari','maart','april','mei','juni','juli','augustus','september','oktober','november','december'];

EP.forEach(e=>{e.hash='#e-'+e.key;e.npoUrl=e.id?`https://www.nporadio1.nl/podcasts/de-ongelooflijke-podcast/${e.id}/${e.n!=null?e.n+'-':''}${e.sl}`:'';e.nt=norm(e.t);e.nx=norm(e.x||e.xs||'');e.ng=norm(e.g.join(' | '))});
const byKey=Object.fromEntries(EP.map(e=>[e.key,e]));
const byNum=Object.fromEntries(EP.filter(e=>e.n!=null).map(e=>[e.n,e]));
const REG=EP.filter(e=>e.f!=='Trailer'&&e.f!=='Spin-off');
const escRe=t=>t.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
const wre=t=>new RegExp('(^|[^a-z0-9])'+escRe(t));
const YEARS=[...new Set(EP.map(e=>e.y))].sort();

// ---------- people ----------
var NAMETOK=new Set();
const P={};
function addP(name,e,role){const k=slug(name);(P[k]=P[k]||{name,k,role,eps:[]}).eps.push(e)}
EP.forEach(e=>{e.g.forEach(g=>addP(g,e,'Gast'));if(e.p&&e.f!=='Trailer')addP('Stefan Paas',e,'Vaste gast');if(e.f!=='Trailer'&&e.f!=='Spin-off')addP('David Boogerd',e,'Presentator')});
Object.values(P).forEach(p=>{p.eps.sort((a,b)=>a.d<b.d?-1:1);p.secs=p.eps.reduce((a,e)=>a+e.s,0);p.bio=D.bios[p.name]||''});
P['stefan-paas'].role='Vaste gast';P['david-boogerd'].role='Presentator';
const PEOPLE=Object.values(P);
NAMETOK=new Set(PEOPLE.flatMap(p=>p.name.toLowerCase().split(/[\s-]+/)).filter(w=>w.length>3));
const GUESTS=PEOPLE.filter(p=>p.role==='Gast');
const initials=n=>n.split(/\s+/).filter(w=>/^[A-ZÀ-Þ]/.test(w)).map(w=>w[0]).slice(0,2).join('')||n[0];
const plink=(name,cls='')=>`<a class="${cls}" href="#p-${slug(name)}">${esc(name)}</a>`;

// ---------- words ----------
const STOP=new Set(`aan aangezien achter af al alle allemaal alleen alles als altijd ander andere anders behalve beide ben bent beter bij binnen boven bovendien daar daarbij daarin daarna daarom daarover dan dat de deze die dit doch doen door dus echter een eens eerst eerste elk elke en enige enkele enz er erg ergens even ga gaan gaat geen gehad geweest gewoon haar had heb hebben heeft hem het hier hij hoe hoewel hun ik in is ja je jij jou jouw juist kan kon konden kun kunnen maar me meer meeste men met mij mijn misschien moet moeten na naar nadat net niet niets nog nooit nu of om omdat onder ons onze ook op over pas per plaats reeds rond samen sinds sommige steeds te tegen ten ter tijdens toch toe toen tot tussen u uit uw van vanaf veel verder via vol voor vooral vrij waar waarom wanneer want waren was wat we wel welk welke werd werden wie wij wil willen word worden wordt zal ze zelf zich zichzelf zij zijn zo zoals zodat zonder zou zouden zulke bijvoorbeeld eigenlijk echt heel weer gaat komt komen kwam maakt maken laat laten staat staan zegt zeggen zien ziet waarin waarmee waardoor iets iemand jaar jaren keer onze deze dezen hele zeer best goed groot grote kleine klein nieuwe nieuw oude lang lange veel vele weinig andere eigen manier vraag vragen vraagt waarbij hierover welke zowel zult wellicht vaak soms tweede twee drie vier vijf zes zeven acht negen tien honderd duizend daarnaast zelfs bijna helemaal tegelijkertijd terwijl totdat volgens tijdens binnenkort inmiddels ondanks verschillende eerder later vandaag gisteren morgen uiteraard natuurlijk volgens ervan erover ermee erin hierin waarover hebt had heeft zitten zit kunnen krijgen krijgt gaan ging gingen gaat moet mogen mag spreekt spreken sprak praat praten gesprek gesprekken aflevering afleveringen podcast ongelooflijke david boogerd stefan paas vaste gast gasten theoloog hoogleraar universiteit spreekt bespreken bespreekt bespreekt vertelt vertellen waarover samen luister luisteren deel nieuwste vorige volgende waarom hoe wat wie welke anno ging zien doet deed gedaan leven mensen mens dingen ding wereld vindt vinden vond denk denkt dacht nederland nederlandse amsterdam utrecht theologische vrije`.split(/\s+/));
const tok=s=>(s.toLowerCase().match(/[a-zà-öø-ÿ]+(?:-[a-zà-öø-ÿ]+)*/g)||[]).filter(w=>w.length>3&&!STOP.has(w));
const DF={};
EP.forEach(e=>{e.tf={};tok(e.t+' '+e.t+' '+(e.x||e.xs||'')).forEach(w=>e.tf[w]=(e.tf[w]||0)+1);Object.keys(e.tf).forEach(w=>DF[w]=(DF[w]||0)+1)});
const N=EP.length;
EP.forEach(e=>{const v={};let n=0;for(const w in e.tf){const x=e.tf[w]*Math.log(N/DF[w]);v[w]=x;n+=x*x}n=Math.sqrt(n)||1;for(const w in v)v[w]/=n;e.vec=v;e.kw=Object.entries(v).filter(([w])=>DF[w]>1).sort((a,b)=>b[1]-a[1]).slice(0,10).map(x=>x[0])});
function similar(e,k=5){return REG.filter(o=>o!==e).map(o=>{let s=0;const a=e.vec,b=o.vec;for(const w in a)if(b[w])s+=a[w]*b[w];return [o,s]}).sort((a,b)=>b[1]-a[1]).slice(0,k)}
const _EP_FETCH={};
async function fetchEpisodeDetail(e){
  if(e._loaded)return;
  const k=e.key;
  if(_EP_FETCH[k])return _EP_FETCH[k];
  _EP_FETCH[k]=fetch('data/episodes/'+k+'.json')
    .then(r=>r.ok?r.json():Promise.reject(r.status))
    .then(d=>{Object.assign(e,d);e.npoUrl=e.id?`https://www.nporadio1.nl/podcasts/de-ongelooflijke-podcast/${e.id}/${e.n!=null?e.n+'-':''}${e.sl}`:'';e._loaded=true;delete _EP_FETCH[k]})
    .catch(()=>{e._loaded=true;delete _EP_FETCH[k]});
  return _EP_FETCH[k];
}
function countWords(list){const c={};list.forEach(e=>{for(const w in e.tf)if(!NAMETOK.has(w))c[w]=(c[w]||0)+e.tf[w]});return c}

// ---------- themes ----------
const THEMES=[...new Set(EP.flatMap(e=>e.th))].sort((a,b)=>EP.filter(e=>e.th.includes(b)).length-EP.filter(e=>e.th.includes(a)).length);
const FORMATS=['Gesprek','Live','Café','Best Of','Q&A','Spin-off','Trailer'];

// ---------- shared renderers ----------
function snippet(e,terms){
  const ex=e.x||e.xs||'';
  if(!terms.length)return esc(ex.slice(0,220))+(ex.length>220?'…':'');
  const nx=e.nx;let i=-1;for(const t of terms){i=nx.indexOf(t);if(i>=0)break}
  if(i<0)return esc(ex.slice(0,200))+'…';
  const a=Math.max(0,i-90),b=Math.min(ex.length,i+150);
  return (a?'…':'')+hl(ex.slice(a,b),terms)+(b<ex.length?'…':'');
}
function hl(s,terms){if(!terms.length)return esc(s);const n=norm(s);const marks=[];terms.forEach(t=>{let i=0;while((i=n.indexOf(t,i))>=0){marks.push([i,i+t.length]);i+=t.length}});if(!marks.length)return esc(s);marks.sort((a,b)=>a[0]-b[0]);let out='',p=0;marks.forEach(([a,b])=>{if(a<p)return;out+=esc(s.slice(p,a))+'<mark>'+esc(s.slice(a,b))+'</mark>';p=b});return out+esc(s.slice(p))}
function epRow(e,terms=[]){
  const badge=e.f!=='Gesprek'?`<span class="badge">${esc(e.f)}</span>`:'';
  const guests=e.g.length?' · '+e.g.map(g=>`<a href="#p-${slug(g)}">${hl(g,terms)}</a>`).join(', '):'';
  return `<article class="ep"><div class="no">${e.n!=null?'#'+e.n:'—'}</div><div style="min-width:0"><h3><a href="${e.hash}">${hl(e.t,terms)}</a>${badge}</h3>
  <div class="meta">${fdate(e.d)}${guests}</div><p class="snip">${snippet(e,terms)}</p>${terms.length&&state.tx?fragHits(e,terms):''}
  <div class="chips">${e.th.map(t=>`<a class="chip" href="#t-${slug(t)}">${esc(t)}</a>`).join('')}</div></div><div class="dur">${fdur(e.s)}</div></article>`;
}
const personCard=p=>`<a class="person" href="#p-${p.k}"><span class="ini ${p.role!=='Gast'?'host':''}">${esc(initials(p.name))}</span><span><b>${esc(p.name)}</b><span>${p.role} · ${p.eps.length} ${p.eps.length===1?'aflevering':'afleveringen'}</span></span></a>`;

// ---------- charts ----------
function vbars(data,{h=200,fmt=v=>nl(v),cls='bar',line=null,lineFmt=null}={}){
  const W=560,pl=36,pr=line?40:8,pt=14,pb=26,iw=W-pl-pr,ih=h-pt-pb;
  const max=Math.max(...data.map(d=>d.v))||1,nice=niceMax(max),bw=iw/data.length;
  let s=`<svg class="c" viewBox="0 0 ${W} ${h}" role="img">`;
  ticks(nice).forEach(t=>{const y=pt+ih-ih*t/nice;s+=`<line class="grid" x1="${pl}" x2="${W-pr}" y1="${y}" y2="${y}"/><text x="${pl-6}" y="${y+4}" text-anchor="end">${fmt(t)}</text>`});
  data.forEach((d,i)=>{const bh=ih*d.v/nice,x=pl+i*bw+bw*.18;s+=`<rect class="${cls}" x="${x}" y="${pt+ih-bh}" width="${bw*.64}" height="${bh}" rx="2"><title>${esc(d.l)}: ${fmt(d.v)}</title></rect><text x="${pl+i*bw+bw/2}" y="${h-8}" text-anchor="middle">${esc(d.l)}</text>`;
    if(data.length<=10)s+=`<text class="lbl" x="${pl+i*bw+bw/2}" y="${pt+ih-bh-4}" text-anchor="middle">${fmt(d.v)}</text>`});
  if(line){const lm=niceMax(Math.max(...line));const pts=line.map((v,i)=>[pl+i*bw+bw/2,pt+ih-ih*v/lm]);s+=`<polyline class="line" points="${pts.map(p=>p.join(',')).join(' ')}"/>`;pts.forEach((p,i)=>s+=`<circle cx="${p[0]}" cy="${p[1]}" r="3.5" fill="var(--violet)"><title>${lineFmt(line[i])}</title></circle>`);ticks(lm).forEach(t=>{const y=pt+ih-ih*t/lm;s+=`<text x="${W-pr+6}" y="${y+4}">${lineFmt(t)}</text>`})}
  return s+'</svg>';
}
function niceMax(m){const p=Math.pow(10,Math.floor(Math.log10(m)));const f=m/p;return (f<=1?1:f<=2?2:f<=2.5?2.5:f<=5?5:10)*p}
function ticks(n){return [0,n/4,n/2,n*3/4,n]}
function hbars(rows,{max=null,cls='',fmt=v=>nl(v)}={}){const m=max||Math.max(...rows.map(r=>r.v))||1;return `<div class="hbars">${rows.map(r=>`<div class="hbar">${r.href?`<a href="${r.href}" title="${esc(r.l)}">${esc(r.l)}</a>`:`<span class="n">${esc(r.l)}</span>`}<div class="t"><i class="${cls}" style="width:${(r.v/m*100).toFixed(1)}%"></i></div><span class="v">${fmt(r.v)}</span></div>`).join('')}</div>`}
function scatter(list,{h=260}={}){
  const W=1000,pl=40,pr=10,pt=12,pb=26,iw=W-pl-pr,ih=h-pt-pb;
  const t0=Date.parse(YEARS[0]+'-01-01'),t1=Date.parse((YEARS.at(-1)+1)+'-01-01');const ymax=niceMax(Math.max(...list.map(e=>e.min)));
  let s=`<svg class="c" viewBox="0 0 ${W} ${h}" role="img" aria-label="Duur per aflevering">`;
  ticks(ymax).forEach(t=>{const y=pt+ih-ih*t/ymax;s+=`<line class="grid" x1="${pl}" x2="${W-pr}" y1="${y}" y2="${y}"/><text x="${pl-6}" y="${y+4}" text-anchor="end">${t}′</text>`});
  YEARS.concat(YEARS.at(-1)+1).forEach(y=>{const x=pl+iw*(Date.parse(y+'-01-01')-t0)/(t1-t0);s+=`<line class="grid" x1="${x}" x2="${x}" y1="${pt}" y2="${pt+ih}"/>`;if(y<=YEARS.at(-1))s+=`<text x="${x+iw/(YEARS.length)/2}" y="${h-8}" text-anchor="middle">${y}</text>`});
  list.forEach(e=>{const x=pl+iw*(Date.parse(e.d)-t0)/(t1-t0),y=pt+ih-ih*e.min/ymax;s+=`<a href="${e.hash}"><circle class="dot" cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="4" ${e.f!=='Gesprek'?'style="fill:var(--violet)"':''}><title>${e.n!=null?'#'+e.n+' ':''}${esc(e.t)} — ${fdur(e.s)}</title></circle></a>`});
  return s+'</svg>';
}
function lines(series,labels,{h=240,fmt=v=>v,W=1000}={}){
  const pl=40,pr=30,pt=14,pb=26,iw=W-pl-pr,ih=h-pt-pb;const cols=['var(--violet)','var(--gold-deep)','var(--ink)'];
  const ymax=niceMax(Math.max(1,...series.flatMap(s=>s.v)));const step=iw/Math.max(1,labels.length-1);
  let s=`<svg class="c" viewBox="0 0 ${W} ${h}" role="img">`;
  ticks(ymax).forEach(t=>{const y=pt+ih-ih*t/ymax;s+=`<line class="grid" x1="${pl}" x2="${W-pr}" y1="${y}" y2="${y}"/><text x="${pl-6}" y="${y+4}" text-anchor="end">${fmt(t)}</text>`});
  const every=Math.ceil(labels.length/12);labels.forEach((l,i)=>{if(i%every===0)s+=`<text x="${pl+i*step}" y="${h-8}" text-anchor="middle">${esc(l)}</text>`});
  series.forEach((se,k)=>{const pts=se.v.map((v,i)=>[pl+i*step,pt+ih-ih*v/ymax]);s+=`<polyline fill="none" stroke="${cols[k]}" stroke-width="2.5" points="${pts.map(p=>p.map(n=>n.toFixed(1)).join(',')).join(' ')}"/>`;pts.forEach((p,i)=>s+=`<circle cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="3" fill="${cols[k]}"><title>${esc(se.name)} · ${esc(labels[i])}: ${fmt(se.v[i])}</title></circle>`)});
  return s+'</svg>'+`<div class="legend">${series.map((se,k)=>`<span><i style="background:${cols[k]}"></i>${esc(se.name)}</span>`).join('')}</div>`;
}
function timeline(eps){const t0=Date.parse(YEARS[0]+'-01-01'),t1=Date.parse((YEARS.at(-1)+1)+'-01-01');const pos=d=>((Date.parse(d)-t0)/(t1-t0)*100).toFixed(2);
  return `<div class="tl"><div class="axis"></div>${YEARS.map(y=>`<span style="left:${pos(y+'-07-01')}%">${y}</span>`).join('')}${eps.map(e=>`<a href="${e.hash}" style="left:${pos(e.d)}%" title="${e.n!=null?'#'+e.n+' ':''}${esc(e.t)} (${fdate(e.d)})" aria-label="${esc(e.t)}"></a>`).join('')}</div>`}


// ---------- transcript layer (VOORBEELDDATA) ----------

  app.innerHTML=`<div class="crumb"><a href="#personen">Personen</a> / ${esc(p.name)}</div>
  <div class="detail"><div style="min-width:0">
  <div style="display:flex;gap:18px;align-items:center;margin-bottom:12px"><span class="ini ${isHost?'host':''}" style="width:72px;height:72px;font-size:24px;flex-shrink:0">${esc(initials(p.name))}</span><div><div class="epno">${p.role}</div><h1>${esc(p.name)}</h1></div></div>
  ${p.bio?`<p class="prose" style="font-size:20px">${esc(p.bio)}</p>`:''}
  <div class="facts" style="grid-template-columns:repeat(4,minmax(0,1fr))"><div><b>${p.eps.length}</b><span>${p.eps.length===1?'aflevering':'afleveringen'}</span></div><div><b>${fhours(p.secs)}</b><span>uur aan tafel</span></div><div><b>${Math.round(avg/60)}′</b><span>gem. duur per aflevering</span></div><div><b>${share<1?share.toFixed(1):Math.round(share)}%</b><span>van alle afleveringen</span></div></div>
  <section style="margin-top:28px"><h2 style="margin-bottom:4px">Tijdlijn</h2>${timeline(p.eps)}</section>
  ${p.eps.length>3?`<section style="margin-top:28px"><h2>Afleveringen per jaar</h2>${vbars(byYear,{h:170})}</section>`:''}
  <section style="margin-top:32px"><div class="sechead"><h2>${p.eps.length===1?'Aflevering':'Alle afleveringen'}</h2><span class="label">nieuwste eerst</span></div><div class="eps">${eps.slice(0,isHost?30:200).map(e=>epRow(e)).join('')}</div>${isHost&&eps.length>30?`<p><a class="btn" href="#zoeken" id="allp">Bekijk alle ${eps.length} in de zoeker</a></p>`:''}</section>
  </div><aside class="side">
  <div class="panel"><h3>Gegevens</h3><dl class="kv"><dt>Eerste keer</dt><dd><a href="${p.eps[0].hash}">${fdate(p.eps[0].d)}</a></dd><dt>Laatste keer</dt><dd><a href="${p.eps.at(-1).hash}">${fdate(p.eps.at(-1).d)}</a></dd><dt>Langste</dt><dd>${fdur(Math.max(...p.eps.map(e=>e.s)))}</dd><dt>Kortste</dt><dd>${fdur(Math.min(...p.eps.map(e=>e.s)))}</dd>${!isHost?`<dt>Met Paas</dt><dd>${p.eps.filter(e=>e.p).length} van ${p.eps.length}</dd>`:''}</dl></div>
  ${Object.keys(th).length?`<div class="panel"><h3>Thema's</h3>${hbars(Object.entries(th).sort((a,b)=>b[1]-a[1]).slice(0,8).map(([t,v])=>({l:t,v,href:'#t-'+slug(t)})))}</div>`:''}
  ${coRows.length?`<div class="panel"><h3>Samen aan tafel met</h3>${hbars(coRows.map(([g,v])=>({l:g,v,href:'#p-'+slug(g)})),{cls:'v'})}</div>`:''}
  <div class="panel"><h3>${p.eps.length>20?'Meest gebruikte woorden':'Kenmerkende woorden'}</h3><div class="cloud">${words.map(([w,c])=>`<a href="#zoeken" data-q="${esc(w)}" style="font-size:${(13+13*c/wm).toFixed(1)}px">${esc(w)}</a>`).join('')}</div><p class="ui muted" style="font-size:12px;margin:10px 0 0">Uit titels en omschrijvingen van de afleveringen.</p></div>
  ${personTx(p)}
  </aside></div>`;
  const ap=$('#allp');if(ap)ap.onclick=()=>{state.q=p.name;$('#q').value=p.name};
}

function viewPeople(){
  const sorts={n:(a,b)=>b.eps.length-a.eps.length||b.secs-a.secs,a:(a,b)=>surname(a.name).localeCompare(surname(b.name),'nl'),r:(a,b)=>a.eps.at(-1).d<b.eps.at(-1).d?1:-1,t:(a,b)=>b.secs-a.secs};
  function surname(n){const parts=n.split(' ');const i=parts.findIndex((w,k)=>k>0&&/^[A-ZÀ-Þ]/.test(w)&&k===parts.length-1);return parts.slice(-1)[0]}
  app.innerHTML=`<h1>Personen</h1><p class="lede prose muted" style="margin:8px 0 18px">De presentator, de vaste gast en ${GUESTS.length} gasten. Kies een naam voor alle afleveringen, statistieken en de woorden die rond die persoon vallen.</p>
  <div class="ctrl"><input id="pf" type="search" placeholder="Filter op naam" aria-label="Filter op naam" style="flex:1 1 200px"><label>Sorteer <select id="ps"><option value="n">Meeste afleveringen</option><option value="t">Meeste luistertijd</option><option value="r">Recent te gast</option><option value="a">Achternaam A–Z</option></select></label></div>
  <h2 style="margin:18px 0 8px">Vaste gezichten</h2><div class="people">${[P['david-boogerd'],P['stefan-paas']].map(personCard).join('')}</div>
  <h2 style="margin:28px 0 8px">Gasten</h2><div class="people" id="plist"></div>`;
  const draw=()=>{const f=norm($('#pf').value);$('#plist').innerHTML=GUESTS.filter(p=>norm(p.name).includes(f)).sort(sorts[$('#ps').value]).map(personCard).join('')||'<p class="empty">Geen naam gevonden.</p>'};
  $('#pf').oninput=draw;$('#ps').onchange=draw;draw();
}

function viewThemes(){
  const rows=THEMES.map(t=>({t,eps:EP.filter(e=>e.th.includes(t))}));
  app.innerHTML=`<h1>Thema's</h1><p class="prose muted" style="margin:8px 0 22px">Elke aflevering is automatisch ingedeeld bij maximaal vier thema's, op basis van de woorden in titel en omschrijving.</p>
  <div class="charts">${rows.map(r=>`<a href="#t-${slug(r.t)}" class="panel" style="text-decoration:none;color:var(--ink);display:block"><h3 style="margin-bottom:2px">${esc(r.t)}</h3><div class="ui muted" style="font-size:14px">${r.eps.length} afleveringen · ${fhours(r.eps.reduce((a,e)=>a+e.s,0))} uur</div>${vbars(YEARS.map(y=>({l:String(y).slice(2),v:r.eps.filter(e=>e.y===y).length})),{h:120})}</a>`).join('')}</div>`;
}
function viewTheme(t){
  if(!t)return notFound();
  const eps=EP.filter(e=>e.th.includes(t)).sort((a,b)=>a.d<b.d?1:-1);
  const g={};eps.forEach(e=>e.g.forEach(x=>g[x]=(g[x]||0)+1));
  const wc=countWords(eps);const words=Object.entries(wc).map(([w,c])=>[w,c*Math.log(N/DF[w])]).sort((a,b)=>b[1]-a[1]).slice(0,30);const wm=words[0]?words[0][1]:1;
  app.innerHTML=`<div class="crumb"><a href="#themas">Thema's</a> / ${esc(t)}</div><div class="detail"><div style="min-width:0"><h1>${esc(t)}</h1><p class="ui muted">${eps.length} afleveringen · ${fhours(eps.reduce((a,e)=>a+e.s,0))} uur</p>
  <h2 style="margin-top:22px">Aandeel per jaar</h2><p class="ui muted" style="font-size:13px;margin:0 0 8px">Percentage van de afleveringen in dat jaar.</p>${vbars(YEARS.map(y=>{const all=REG.filter(e=>e.y===y).length;return {l:String(y),v:all?Math.round(eps.filter(e=>e.y===y).length/all*100):0}}),{h:180,fmt:v=>v+'%'})}
  <div class="eps" style="margin-top:24px">${eps.map(e=>epRow(e)).join('')}</div></div>
  <aside class="side"><div class="panel"><h3>Gasten binnen dit thema</h3>${hbars(Object.entries(g).sort((a,b)=>b[1]-a[1]).slice(0,10).map(([x,v])=>({l:x,v,href:'#p-'+slug(x)})))}</div>
  <div class="panel"><h3>Kenmerkende woorden</h3><div class="cloud">${words.map(([w,c])=>`<a href="#zoeken" data-q="${esc(w)}" style="font-size:${(13+13*c/wm).toFixed(1)}px">${esc(w)}</a>`).join('')}</div></div></aside></div>`;
}

const ws={mode:'year',y:YEARS.at(-1),m:'',kind:'top',trend:'trump, oorlog, ai'};
function viewStats(){
  const per=YEARS.map(y=>REG.filter(e=>e.y===y));
  const wd=[1,2,3,4,5,6,0].map(d=>({l:DAYS[d].slice(0,2),v:REG.filter(e=>new Date(e.d).getDay()===d).length}));
  const topG=[...GUESTS].sort((a,b)=>b.eps.length-a.eps.length||b.secs-a.secs).slice(0,12);
  const topT=[...GUESTS].sort((a,b)=>b.secs-a.secs).slice(0,12);
  const sorted=[...REG].filter(e=>e.f!=='Spin-off').sort((a,b)=>b.s-a.s);
  const gaps=REG.filter(e=>e.n!=null).sort((a,b)=>a.d<b.d?-1:1).map((e,i,a)=>i?(Date.parse(e.d)-Date.parse(a[i-1].d))/864e5:null).filter(x=>x!=null).sort((a,b)=>a-b);
  const median=gaps[Math.floor(gaps.length/2)];
  const heat=THEMES.map(t=>({t,v:YEARS.map((y,i)=>per[i].length?per[i].filter(e=>e.th.includes(t)).length/per[i].length:0)}));
  const hmax=Math.max(...heat.flatMap(h=>h.v));
  const paasPct=Math.round(REG.filter(e=>e.p).length/REG.length*100);
  app.innerHTML=`<h1>Statistieken</h1><p class="prose muted" style="margin:8px 0 6px">Berekend uit ${REG.length} afleveringen van ${fdate(REG.at(-1).d)} tot ${fdate(REG[0].d)}.</p>
  <div class="facts"><div><b>${nl(Math.round(REG.reduce((a,e)=>a+e.s,0)/3600))}</b><span>uur in totaal</span></div><div><b>${median}</b><span>dagen tussen afleveringen (mediaan)</span></div><div><b>${paasPct}%</b><span>met Stefan Paas aan tafel</span></div><div><b>${Math.round(GUESTS.filter(p=>p.eps.length>1).length/GUESTS.length*100)}%</b><span>van de gasten kwam terug</span></div></div>
  <section><div class="charts">
   <div class="chart"><h3>Afleveringen per jaar</h3><p class="note">Staven: aantal afleveringen. Lijn: gemiddelde duur in minuten (rechteras).</p>${vbars(per.map((l,i)=>({l:String(YEARS[i]),v:l.length})),{line:per.map(l=>l.length?Math.round(l.reduce((a,e)=>a+e.min,0)/l.length):0),lineFmt:v=>Math.round(v)+'′'})}</div>
   <div class="chart"><h3>Uren per jaar</h3><p class="note">Totale speelduur van alle afleveringen in dat jaar.</p>${vbars(per.map((l,i)=>({l:String(YEARS[i]),v:Math.round(l.reduce((a,e)=>a+e.s,0)/3600)})),{cls:'bar2',fmt:v=>v+' u'})}</div>
   <div class="chart wide"><h3>Duur van elke aflevering</h3><p class="note">Elke stip is een aflevering; paars zijn live-afleveringen, Café, Best Of en andere specials. Klik voor de aflevering.</p><div class="scroll"><div style="min-width:640px">${scatter(REG)}</div></div></div>
   <div class="chart"><h3>Vaakst te gast</h3><p class="note">Aantal afleveringen, zonder presentator en vaste gast.</p>${hbars(topG.map(p=>({l:p.name,v:p.eps.length,href:'#p-'+p.k})))}</div>
   <div class="chart"><h3>Meeste tijd aan tafel</h3><p class="note">Opgetelde duur van de afleveringen, in uren.</p>${hbars(topT.map(p=>({l:p.name,v:+(p.secs/3600).toFixed(1),href:'#p-'+p.k})),{cls:'v',fmt:v=>v.toLocaleString('nl-NL')})}</div>
   <div class="chart wide"><h3>Thema's door de jaren heen</h3><p class="note">Aandeel van de afleveringen per jaar waarin het thema voorkomt.</p><div class="scroll"><table class="heat"><thead><tr><th></th>${YEARS.map(y=>`<th>${y}</th>`).join('')}</tr></thead><tbody>${heat.map(h=>`<tr><th><a href="#t-${slug(h.t)}" style="color:var(--ink)">${esc(h.t)}</a></th>${h.v.map(v=>`<td><div style="background:color-mix(in srgb,var(--gold) ${Math.round(v/hmax*100)}%,var(--parchment-2));color:${v/hmax>.55?'#3e2b16':'var(--ink-muted)'}" title="${Math.round(v*100)}%">${Math.round(v*100)}</div></td>`).join('')}</tr>`).join('')}</tbody></table></div></div>
   <div class="chart wide" id="words"></div>
   <div class="chart wide" id="trend"></div>
   <div class="chart"><h3>Verschijningsdag</h3><p class="note">Op welke weekdag afleveringen uitkwamen.</p>${vbars(wd,{h:180})}</div>
   <div class="chart"><h3>Records</h3><div class="hbars" style="gap:10px;font-size:15px">
     <div><span class="label">Langste</span><br><a href="${sorted[0].hash}">#${sorted[0].n} ${esc(sorted[0].t)}</a> <span class="muted">· ${fdur(sorted[0].s)}</span></div>
     <div><span class="label">Kortste gesprek</span><br>${(()=>{const e=sorted.filter(e=>e.f==='Gesprek').at(-1);return `<a href="${e.hash}">#${e.n} ${esc(e.t)}</a> <span class="muted">· ${fdur(e.s)}</span>`})()}</div>
     <div><span class="label">Langste omschrijving</span><br>${(()=>{const e=[...REG].sort((a,b)=>(b.x||b.xs||'').length-(a.x||a.xs||'').length)[0];return `<a href="${e.hash}">#${e.n} ${esc(e.t)}</a> <span class="muted">· ${nl((e.x||e.xs||'').split(/\s+/).length)} woorden</span>`})()}</div>
     <div><span class="label">Meest aangeraden door de makers</span><br>${(()=>{const c={};REG.forEach(e=>e.r.forEach(n=>c[n]=(c[n]||0)+1));const [n,v]=Object.entries(c).sort((a,b)=>b[1]-a[1])[0];const e=byNum[n];return `<a href="${e.hash}">#${n} ${esc(e.t)}</a> <span class="muted">· ${v}× genoemd</span>`})()}</div>
   </div></div>
   ${statsTx()}
  </div></section>`;
  drawWords();drawTrend();
}
function drawWords(){
  const pool=REG.filter(e=>e.y===+ws.y&&(!ws.m||e.m===+ws.m));
  const c=countWords(pool);let rows;
  if(ws.kind==='top')rows=Object.entries(c).sort((a,b)=>b[1]-a[1]);
  else{const all=countWords(REG);const tp=Object.values(c).reduce((a,b)=>a+b,0)||1,ta=Object.values(all).reduce((a,b)=>a+b,0);rows=Object.entries(c).filter(([w,v])=>v>=2).map(([w,v])=>[w,+((v/tp)/(all[w]/ta)).toFixed(1)]).sort((a,b)=>b[1]-a[1])}
  rows=rows.slice(0,24);
  const months=[...new Set(REG.filter(e=>e.y===+ws.y).map(e=>e.m))].sort((a,b)=>a-b);
  $('#words').innerHTML=`<h3>Meest gebruikte woorden</h3><p class="note">Uit titels en omschrijvingen, zonder stopwoorden. “Kenmerkend” toont woorden die in die periode vaker voorkomen dan gemiddeld.</p>
  <div class="ctrl"><select id="w-y" aria-label="Jaar">${YEARS.map(y=>`<option ${y===+ws.y?'selected':''}>${y}</option>`).join('')}</select><select id="w-m" aria-label="Maand"><option value="">Hele jaar</option>${months.map(m=>`<option value="${m}" ${m===+ws.m?'selected':''}>${MONTHS[m-1]}</option>`).join('')}</select>
  <select id="w-k" aria-label="Soort"><option value="top" ${ws.kind==='top'?'selected':''}>Meest gebruikt</option><option value="dist" ${ws.kind==='dist'?'selected':''}>Kenmerkend</option></select><span class="muted">${pool.length} afleveringen</span></div>
  ${rows.length?`<div style="columns:2 280px;column-gap:28px">${hbars(rows.map(([w,v])=>({l:w,v})),{fmt:v=>ws.kind==='top'?nl(v):v.toLocaleString('nl-NL')+'×'})}</div>`:'<p class="empty">Geen afleveringen in deze periode.</p>'}`;
  $('#w-y').onchange=ev=>{ws.y=+ev.target.value;ws.m='';drawWords()};$('#w-m').onchange=ev=>{ws.m=ev.target.value;drawWords()};$('#w-k').onchange=ev=>{ws.kind=ev.target.value;drawWords()};
  $('#words').querySelectorAll('.hbar span.n').forEach(el=>{const w=el.textContent;el.outerHTML=`<a href="#zoeken" data-q="${esc(w)}">${esc(w)}</a>`});
}
function drawTrend(){
  const words=ws.trend.split(',').map(s=>norm(s.trim())).filter(Boolean).slice(0,3);
  const series=words.map(w=>({name:w,v:YEARS.map(y=>{const l=REG.filter(e=>e.y===y);const r=wre(w);return l.length?Math.round(l.filter(e=>r.test(e.nt)||r.test(e.nx)).length/l.length*100):0})}));
  $('#trend').innerHTML=`<h3>Woordtrend</h3><p class="note">Percentage afleveringen per jaar waarin het woord in titel of omschrijving staat. Tot drie woorden, gescheiden door komma's.</p>
  <form class="ctrl" id="tf"><input id="t-in" value="${esc(ws.trend)}" aria-label="Woorden" style="flex:1 1 260px"><button class="btn" type="submit">Vergelijk</button></form>
  ${series.length?`<div class="scroll"><div style="min-width:560px">${lines(series,YEARS.map(String),{fmt:v=>v+'%'})}</div></div>`:''}`;
  $('#tf').onsubmit=ev=>{ev.preventDefault();ws.trend=$('#t-in').value;drawTrend()};
}

function notFound(){app.innerHTML=`<h1>Niet gevonden</h1><p class="empty">Deze pagina bestaat niet in het archief. <a href="#zoeken">Doorzoek alle afleveringen</a>.</p>`}

// ---------- router ----------
const THEME_BY_SLUG=Object.fromEntries(THEMES.map(t=>[slug(t),t]));
function route(){
  if(PL&&PL.raf)cancelAnimationFrame(PL.raf);PL=null;app.classList.remove('has-player');
  const h=location.hash.slice(1)||'start';let nav='';
  if(h==='start')viewHome();
  else if(h==='zoeken'){viewSearch();nav='zoeken'}
  else if(h==='personen'){viewPeople();nav='personen'}
  else if(h==='themas'){viewThemes();nav='themas'}
  else if(h==='statistieken'){viewStats();nav='statistieken'}
  else if(h==='genoemd'||h==='citaten'){viewMentions();nav='genoemd'}
  else if(h.startsWith('m-')){viewMention(mentionAgg().byK[h.slice(2)]);nav='genoemd'}
  else if(h==='wie-zei-het'){viewQuiz();nav='quiz'}
  else if(h.startsWith('e-')){viewEpisode(byKey[h.slice(2)]).catch(()=>notFound());nav='zoeken'}
  else if(h.startsWith('p-')){viewPerson(P[h.slice(2)]);nav='personen'}
  else if(h.startsWith('t-')){viewTheme(THEME_BY_SLUG[h.slice(2)]);nav='themas'}
  else notFound();
  document.querySelectorAll('nav.main a').forEach(a=>a.classList.toggle('on',a.dataset.nav===nav));
  window.scrollTo(0,0);
}
document.addEventListener('click',ev=>{const a=ev.target.closest('[data-q]');if(a){state.q=a.dataset.q;$('#q').value=state.q;state.limit=40;if(location.hash==='#zoeken'){ev.preventDefault();viewSearch()}}});
$('#qform').addEventListener('submit',ev=>{ev.preventDefault();state.q=$('#q').value;state.limit=40;if(location.hash==='#zoeken')viewSearch();else location.hash='#zoeken'});
$('#q').addEventListener('input',ev=>{state.q=ev.target.value;state.limit=40;if(location.hash==='#zoeken'){const q2=$('#q2');if(q2)q2.value=state.q;drawRes()}});
window.addEventListener('hashchange',route);
route();
})();
</script>
