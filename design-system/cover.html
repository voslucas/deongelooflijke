<!-- @dsCard height=300 -->
<!doctype html>
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="tokens.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lora:wght@600;700&family=Spectral:wght@400&display=swap">
<style>
  html,body{margin:0;background:var(--parchment);}
  .cover{position:relative;width:960px;height:300px;overflow:hidden;background:var(--parchment);}
  svg{position:absolute;left:0;top:0}
  .gold{fill:var(--gold)} .engr{fill:var(--engraving)} .vio{fill:var(--violet)} .p2{fill:var(--parchment-3)} .vd{fill:var(--violet-deep)}
  .halo{fill:none;stroke:var(--halo);stroke-width:2}
  .rule{stroke:var(--rule);stroke-width:1}
  .txt{position:absolute;left:48px;bottom:44px;max-width:420px}
  .name{font:700 64px/.95 "Lora",Georgia,serif;color:var(--ink);margin:0}
  .tag{font:400 14px/1.4 "Spectral",Georgia,serif;color:var(--ink-muted);margin:12px 0 0}
</style></head>
<body><div class="cover">
<svg width="960" height="300" viewBox="0 0 960 300" aria-hidden="true">
  <!-- blocks: gold 288×300 (artwork ground), engraving 168×204, violet disc r=72 (wordmark blob), parchment-2 tint 120×96
       arrangement: one tall gold slab bleeding off top/bottom with an engraving slab and a violet disc as satellites
       pattern: a literal motif — the halo: three thin elliptical rings in halo white over the dark blocks (the saint's halo)
       scales: space-4 (24) / space-5 (48) offsets, radius-pill for the disc, radius-md corners on slabs -->
  <line class="rule" x1="480" y1="48" x2="960" y2="48"/>
  <line class="rule" x1="480" y1="252" x2="960" y2="252"/>
  <rect class="p2" x="504" y="168" width="120" height="96" rx="10"/>
  <rect class="gold" x="624" y="-10" width="288" height="320" rx="10"/>
  <rect class="engr" x="696" y="72" width="168" height="204" rx="10"/>
  <circle class="vio" cx="600" cy="96" r="72"/>
  <ellipse class="halo" cx="780" cy="84" rx="96" ry="30" transform="rotate(-14 780 84)"/>
  <ellipse class="halo" cx="780" cy="84" rx="84" ry="24" transform="rotate(-14 780 84)" stroke-dasharray="3 5"/>
  <ellipse class="halo" cx="600" cy="96" rx="48" ry="15" transform="rotate(-14 600 96)"/>
</svg>
<div class="txt"><h1 class="name">De Ongelooflijke</h1><p class="tag">De wereld begrijpen – door geschiedenis, kunst en geloof.</p></div>
</div></body></html>
