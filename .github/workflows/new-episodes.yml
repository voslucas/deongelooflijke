name: Dagelijkse aflevering check

on:
  schedule:
    - cron: '0 7 * * *' # 08:00 Amsterdam in winter, 09:00 in summer
  workflow_dispatch:

permissions:
  contents: write
  actions: write # Explicit deployment dispatch; bot pushes do not trigger push workflows

concurrency:
  group: daily-episode-processing
  cancel-in-progress: false

env:
  PYTHONUTF8: '1'
  PYTHONUNBUFFERED: '1'

jobs:
  check-and-process:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: |
          pip install -r requirements.txt pytest
          python -m spacy download nl_core_news_sm

      - name: Download and validate latest NPO feed
        run: python scripts/fetch_feed.py

      - name: Build episode records
        run: |
          python scripts/1_parse_feed.py
          python scripts/2_extract_guests.py
          python scripts/3_build_episode_data.py

      - name: Find new or unfinished episodes
        id: detect
        run: python scripts/process_new_episodes.py --plan

      - name: Process pending episodes and all enrichment stages
        if: steps.detect.outputs.has_pending == 'true'
        env:
          AZURE_SPEECH_KEY: ${{ secrets.AZURE_SPEECH_KEY }}
          AZURE_SPEECH_ENDPOINT: ${{ secrets.AZURE_SPEECH_ENDPOINT }}
          ANTHROPIC_API_KEY: ${{ secrets.CLAUDE_API_KEY }}
          GOOGLE_BOOKS_API_KEY: ${{ secrets.GOOGLE_BOOKS_API_KEY }}
        run: python scripts/process_new_episodes.py --all-pending

      - name: Download missing book covers
        run: python scripts/book_covers.py

      - name: Validate data and static build
        run: |
          python scripts/4_split_data.py
          python scripts/5b_build_site.py
          python -m pytest tests/ -q

      # Persist completed stages even after an API/build failure, so the next run
      # resumes instead of paying for successful transcription/analysis again.
      - name: Commit processing progress and data
        id: commit
        if: always() && steps.detect.outcome == 'success'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --staged --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "data: update podcast feed and episode processing"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Trigger production build explicitly
        if: success() && steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run build.yml --ref "${{ github.ref_name }}"
